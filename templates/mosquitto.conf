# =============================================================================
# Configuration Mosquitto — rendue par scripts/install.sh depuis ce template.
#
# Le fichier généré est config/mosquitto/mosquitto.conf (non suivi par git).
# Les identifiants MQTT ne figurent PAS ici : Mosquitto authentifie via le
# fichier de mots de passe (password_file), généré par mosquitto_passwd à
# l'installation et monté depuis secrets/mosquitto/passwd.
# =============================================================================

# Écoute sur le port 1883 (toutes les interfaces du conteneur).
# L'exposition au réseau local est bloquée au niveau du port mapping compose
# ("127.0.0.1:1883:1883") : seul le loopback de l'hôte est publié (REQ-INS-005).
listener 1883

# Authentification obligatoire : aucun client anonyme.
allow_anonymous false

# Fichier des mots de passe (généré par mosquitto_passwd à l'installation,
# monté depuis secrets/mosquitto/passwd).
password_file /mosquitto/config/passwd
