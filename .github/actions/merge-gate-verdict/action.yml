name: 'Merge gate verdict'
description: >-
  Fails unless CI succeeded, the AI review succeeded, and no blocking
  label is present. Draft PRs pass vacuously (ready_for_review re-fires
  the pipeline with the real verdict).
inputs:
  ci-result:
    description: 'needs result of the CI job (success expected)'
    required: true
  review-result:
    description: 'needs result of the ai-review job (success expected)'
    required: true
  draft:
    description: 'Whether the PR is a draft (true/false)'
    required: true
  labels:
    description: 'JSON array of the PR label names'
    required: true
  blocking-labels:
    description: 'JSON array of labels that block the merge'
    required: false
    default: '["possible security issue", "size/too-big"]'

runs:
  using: composite
  steps:
    - name: Verdict
      shell: bash
      env:
        CI_RESULT: ${{ inputs.ci-result }}
        REVIEW_RESULT: ${{ inputs.review-result }}
        DRAFT: ${{ inputs.draft }}
        LABELS: ${{ inputs.labels }}
        BLOCKING_LABELS: ${{ inputs.blocking-labels }}
      run: |
        set -euo pipefail
        if [ "${DRAFT}" = "true" ]; then
          echo "draft PR — nothing to gate (ready_for_review re-fires the pipeline)"
          exit 0
        fi
        if [ "${CI_RESULT}" != "success" ]; then
          echo "::error::Condition 1 failed: CI result is ${CI_RESULT}"
          exit 1
        fi
        if [ "${REVIEW_RESULT}" != "success" ]; then
          echo "::error::Condition 2 failed: AI review result is ${REVIEW_RESULT}"
          exit 1
        fi
        HIT="$(echo "${LABELS}" | jq -r --argjson blocking "${BLOCKING_LABELS}" \
          '[.[] | select(. as $l | $blocking | index($l))] | length')"
        if [ "${HIT}" -gt 0 ]; then
          echo "::error::Condition 3 failed: blocking label(s) present on the PR. Fix the findings, or remove the label to record a deliberate override."
          exit 1
        fi
        echo "all three conditions met — mergeable"
