name: 'Automerge Dispatch'
description: >-
  Explicitly dispatch a downstream workflow after a GITHUB_TOKEN-based automerge.
  GitHub's anti-recursion rule means pushes made with GITHUB_TOKEN never trigger
  other workflows - so a PR auto-merged by automation silently starts no build
  or deploy on the target branch while the merge itself looks successful.
  This action re-dispatches the downstream workflow explicitly (with retries)
  and optionally verifies that a workflow_dispatch run appeared for the ref.
  Faithfully extracted from ostara-labs/bot .github/workflows/pr-classify.yml
  (root cause of missed deploys: bot issue #38).

inputs:
  workflow:
    description: 'Target workflow FILE name, e.g. build-and-push.yml'
    required: true
  ref:
    description: 'Branch/ref to dispatch the workflow on'
    required: false
    default: 'main'
  retries:
    description: 'Dispatch attempts before failing'
    required: false
    default: '3'
  verify:
    description: >-
      Wait briefly and confirm a workflow_dispatch run appeared for the ref
      (warn-not-fail: the dispatch API can lag behind the POST).
    required: false
    default: true

runs:
  using: 'composite'
  steps:
    - name: Dispatch downstream workflow (with retries)
      shell: bash
      env:
        WORKFLOW: ${{ inputs.workflow }}
        REF: ${{ inputs.ref }}
        RETRIES: ${{ inputs.retries }}
      run: |
        # ROOT CAUSE (ostara-labs/bot#38): pushes made with GITHUB_TOKEN never
        # trigger other workflows (GitHub anti-recursion rule). A PR merged by
        # automation therefore starts nothing downstream. Dispatch explicitly.
        # Caller must export GH_TOKEN (needs actions:write on the target repo);
        # gh resolves the repository from GITHUB_REPOSITORY automatically.
        sleep 15   # let the merge push land on "$REF" first
        DISPATCH_OK=0
        for attempt in $(seq 1 "$RETRIES"); do
          if gh workflow run "$WORKFLOW" --ref "$REF"; then
            DISPATCH_OK=1
            break
          fi
          echo "dispatch attempt $attempt failed - retrying in 20s"
          sleep 20
        done
        if [ "$DISPATCH_OK" != 1 ]; then
          echo "::error title=automerge-dispatch::Could not dispatch $WORKFLOW after $RETRIES attempts - manual dispatch / deploy catch-up required"
          exit 1
        fi
        echo "Dispatched $WORKFLOW on $REF"

    - name: Verify dispatched run appeared
      if: ${{ inputs.verify == 'true' }}
      shell: bash
      env:
        REF: ${{ inputs.ref }}
      run: |
        # The dispatch API can lag behind the POST - poll briefly (~60s).
        # Warn-not-fail: absence here is not proof of failure.
        sleep 10
        EXPECTED_SHA="${GITHUB_SHA:-}"
        RUN_ID=""
        for _ in $(seq 1 6); do
          JSON="$(gh run list --branch "$REF" --limit 10 --json databaseId,event,headSha)"
          if [ -n "$EXPECTED_SHA" ]; then
            # Prefer a run matching this checkout's sha; fall back to the newest
            # workflow_dispatch run (GITHUB_SHA may be the pre-merge PR sha when
            # the caller is a pull_request-triggered automerge workflow).
            RUN_ID="$(printf '%s' "$JSON" | jq -r --arg sha "$EXPECTED_SHA" \
              '([.[] | select(.event == "workflow_dispatch")]
                | (map(select(.headSha == $sha)) + .)[0].databaseId) // empty')"
          else
            RUN_ID="$(printf '%s' "$JSON" | jq -r \
              '([.[] | select(.event == "workflow_dispatch")][0].databaseId) // empty')"
          fi
          if [ -n "$RUN_ID" ]; then break; fi
          sleep 10
        done
        if [ -n "$RUN_ID" ]; then
          echo "Confirmed: workflow_dispatch run ${RUN_ID} is queued/running on ${REF}"
        else
          echo "::warning title=automerge-dispatch::No workflow_dispatch run detected on ${REF} within ~60s - the API can lag; check ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions if the deploy does not appear"
        fi
