name: CI

# The single required context for this repository ("gate"), mirroring the
# org-wide policy: every repo proves its own health through one aggregate.
# devtools is itself trust-boundary: ALL PRs additionally require human
# review (see trust-boundary-protect.yml).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: ostara-labs/devtools/.github/actions/org-gate@f5b4782 # v1.1.0 (moved to tag after push)

      # devtools-specific: extensionless git hooks are outside the
      # composite's *.sh discovery.
      - name: Shellcheck extensionless hooks
        shell: bash
        run: find hooks -maxdepth 1 -type f -print0 | xargs -0 -r shellcheck -s bash
