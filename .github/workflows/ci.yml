name: CI

# The required contexts for this repository are "gate" (reported by this
# workflow's own pull_request self-run) and "ci / gate" (the caller
# composite in pr-pipeline.yml), mirroring the org-wide policy: every repo
# proves its own health through one aggregate.
# devtools is itself trust-boundary: ALL PRs additionally require human
# review (see trust-boundary-protect.yml).
#
# This workflow is ALSO the org-wide aggregate: consumer repos call it with
# a one-line job named `ci`, exposing exactly seven required contexts:
#   ci / core, ci / rust / rust, ci / elixir / elixir,
#   ci / typescript / typescript, ci / python / python,
#   ci / docs-drift / Docs drift (DOC_MAP), ci / gate
# Language stack jobs are skipped outright when their manifest is absent
# (decided once in `core`): a skipped job starts no runner, where a vacuous
# one still paid a startup to conclude nothing. `gate` treats "skipped" as a
# designed outcome, and the ruleset requires the aggregate `ci / gate` — not
# the individual stacks — so one ruleset still fits every repo. Renaming the
# caller job makes the required contexts never report: merge blocks loudly.
# Language jobs call sibling workflows locally (./) — those resolve from
# THIS repository even when called cross-repo (proven by the pilot). The
# org-gate action, however, must be referenced by remote digest (local
# action refs resolve against the caller's workspace). The caller pins
# THIS workflow's digest.

on:
  push:
    branches: [main]
  pull_request:
  # Merge-queue entries: the queue builds gh-readonly-queue/<base>/pr-N-<sha>
  # with the PR merged onto the current base and fires this event there. The
  # required contexts must report on it, otherwise the entry waits forever.
  # Consumers inherit it through workflow_call; devtools needs it for its own
  # queue self-run.
  merge_group:
  workflow_call:
    inputs:
      stack-dir:
        description: "Base directory containing stack manifests. Empty = each language workflow's own default (rust/, typescript/, elixir/, python/). Use '.' for single-stack repos with manifests at the root."
        required: false
        type: string
        default: ""
      postgis-image:
        description: "Opt-in PostGIS image for the python test-postgis job (e.g. postgis/postgis:17-3.5). Empty = job skipped."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # actionlint + shellcheck + trusted-base secret scanning (org-gate v2).
  # The last step is devtools-specific (extensionless git hooks are outside
  # the composite's *.sh discovery) and is guarded to a no-op in consumer
  # repos — find errors on a missing hooks/ path, so the guard is required.
  core:
    timeout-minutes: 15
    name: core
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ steps.stacks.outputs.rust }}
      elixir: ${{ steps.stacks.outputs.elixir }}
      typescript: ${{ steps.stacks.outputs.typescript }}
      python: ${{ steps.stacks.outputs.python }}
      changed_rust: ${{ steps.changed.outputs.rust }}
      changed_elixir: ${{ steps.changed.outputs.elixir }}
      changed_typescript: ${{ steps.changed.outputs.typescript }}
      changed_python: ${{ steps.changed.outputs.python }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the changed-stack detection below diffs against a
          # base commit that a shallow clone never fetched. A depth-1 checkout
          # would make every diff fail, and the safe fallback would then run
          # every stack - correct, but the filter would never do anything.
          fetch-depth: 0

      # Which stacks are present is decided HERE, once, so an absent stack's
      # job never starts a runner at all: a vacuous job still pays a runner
      # startup, a skipped one costs nothing. The manifest path follows the
      # same stack-dir rule the language workflows use, so a single-stack
      # repo with `stack-dir: "."` is detected correctly too.
      #
      # Safe for every consumer: the ruleset requires only `ci / gate` and
      # `merge-gate` (see scripts/setup-rulesets.sh), so a missing
      # `ci / <stack>` context is not a merge blocker, and `gate` already
      # treats "skipped" as a designed outcome.
      #
      # Placed before org-gate on purpose: the outputs must exist even when
      # the gate step fails, otherwise a failing lint would also silence the
      # test jobs.
      - name: Detect present stacks
        id: stacks
        shell: bash
        env:
          STACK_DIR: ${{ inputs['stack-dir'] }}
        run: |
          has() { local dir="${1%/}"; if [ -f "${dir}/$2" ]; then echo true; else echo false; fi; }
          {
            echo "rust=$(has "${STACK_DIR:-rust}" Cargo.toml)"
            echo "elixir=$(has "${STACK_DIR:-elixir}" mix.exs)"
            echo "typescript=$(has "${STACK_DIR:-typescript}" package.json)"
            echo "python=$(has "${STACK_DIR:-python}" pyproject.toml)"
          } >> "$GITHUB_OUTPUT"

      # Which stacks this change actually touches. Running every stack on every
      # event pays a runner for work that cannot fail: a dependency bump under
      # typescript/ says nothing about the Rust crate, and a docs-only change
      # says nothing about any of the four.
      #
      # The default is deliberately the SAFE direction. A path that is neither
      # under a stack directory nor recognisably documentation marks EVERY
      # stack as changed, because a filter that forgets a shared file stops
      # testing a stack silently - and nobody sees the stack that no longer
      # runs. Over-running shows up in the bill, under-running does not show up
      # at all. Same reasoning that makes `gate` accept "skipped": a false
      # alarm costs a minute, a missed one costs the guarantee.
      - name: Detect changed stacks
        id: changed
        shell: bash
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          MQ_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          STACK_DIR: ${{ inputs['stack-dir'] }}
        run: |
          set -euo pipefail

          # The three event shapes the org-gate base already handles: a pull
          # request carries its base branch, a merge-queue entry its base sha,
          # a push the previous commit.
          if [ -n "${PR_BASE_REF:-}" ]; then base="origin/${PR_BASE_REF}"
          elif [ -n "${MQ_BASE_SHA:-}" ]; then base="${MQ_BASE_SHA}"
          else base="${PUSH_BEFORE:-}"; fi

          every_stack() {
            printf '%s\n' rust=true elixir=true typescript=true python=true
          }

          if [ -z "$base" ] || ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null; then
            echo "no usable base (${base:-empty}) - every stack runs"
            every_stack >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$base" HEAD)"
          echo "base: $base"
          printf 'changed files:\n%s\n' "$files"

          hit_rust=false; hit_elixir=false; hit_typescript=false; hit_python=false
          outside=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            # Documentation cannot break a stack: a README or a page under
            # docs/ changes nothing the four stacks compile or test.
            case "$f" in
              docs/*|*.md|*.txt|LICENSE) continue ;;
            esac
            matched=false
            for s in rust elixir typescript python; do
              # stack-dir "." means the repo is single-stack with its manifest
              # at the root: every path is that stack's path.
              if [ "${STACK_DIR:-$s}" = "." ] || [ "${f#"${STACK_DIR:-$s}"/}" != "$f" ]; then
                case "$s" in
                  rust) hit_rust=true ;;
                  elixir) hit_elixir=true ;;
                  typescript) hit_typescript=true ;;
                  python) hit_python=true ;;
                esac
                matched=true
              fi
            done
            if [ "$matched" = false ]; then outside=true; fi
          done <<< "$files"

          if [ "$outside" = true ]; then
            echo "a path outside every stack directory changed - every stack runs"
            every_stack >> "$GITHUB_OUTPUT"
          else
            {
              echo "rust=${hit_rust}"
              echo "elixir=${hit_elixir}"
              echo "typescript=${hit_typescript}"
              echo "python=${hit_python}"
            } >> "$GITHUB_OUTPUT"
          fi

      # Remote self-reference pinned by digest: local `uses: ./` action
      # references resolve against the CALLER's workspace when this
      # aggregate is invoked via workflow_call from another repo (proven
      # empirically by the bb-league pilot — gate / core failed with
      # "Can't find action.yml" while the local `./` workflow references
      # resolved fine). The composite must therefore be fetched from this
      # repository by digest. Bump the digest in the same PR whenever
      # org-gate changes.
      - uses: ostara-labs/devtools/.github/actions/org-gate@00bb25735ed4b33a8b81a0530c5321a51cfb74f9 # v1.3.1
        with:
          # Three events, three shapes: pull_request carries the base, a
          # merge-queue entry carries merge_group.base_sha, a push carries
          # `before`. Without the merge_group branch the gate would scan an
          # empty range and fail every queue entry.
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

      - name: Shellcheck extensionless hooks
        shell: bash
        run: |
          if [ -d hooks ]; then
            find hooks -maxdepth 1 -type f -print0 | xargs -0 -r shellcheck -s bash
          else
            echo "no hooks/ directory — skipping extensionless hooks shellcheck"
          fi

  # The four language jobs run only when their manifest exists (decided in
  # `core`). When skipped, the check `ci / <stack>` simply does not report —
  # which is why `gate` accepts "skipped" and why the ruleset requires the
  # aggregate, not the individual stacks.
  rust:
    needs: core
    if: ${{ !cancelled() && needs.core.outputs.rust == 'true' && needs.core.outputs.changed_rust == 'true' }}
    uses: ./.github/workflows/rust-ci.yml
    with:
      stack-dir: ${{ inputs['stack-dir'] != '' && inputs['stack-dir'] || 'rust' }}
  elixir:
    needs: core
    if: ${{ !cancelled() && needs.core.outputs.elixir == 'true' && needs.core.outputs.changed_elixir == 'true' }}
    uses: ./.github/workflows/elixir-ci.yml
    with:
      stack-dir: ${{ inputs['stack-dir'] != '' && inputs['stack-dir'] || 'elixir' }}
  typescript:
    needs: core
    if: ${{ !cancelled() && needs.core.outputs.typescript == 'true' && needs.core.outputs.changed_typescript == 'true' }}
    uses: ./.github/workflows/typescript-ci.yml
    with:
      stack-dir: ${{ inputs['stack-dir'] != '' && inputs['stack-dir'] || 'typescript' }}
  python:
    needs: core
    if: ${{ !cancelled() && needs.core.outputs.python == 'true' && needs.core.outputs.changed_python == 'true' }}
    uses: ./.github/workflows/python-ci.yml
    with:
      stack-dir: ${{ inputs['stack-dir'] != '' && inputs['stack-dir'] || 'python' }}
      postgis-image: ${{ inputs.postgis-image }}

  # Docs-drift gate (towncrier-style): code mapped in docs/DOC_MAP.yml must
  # ship with its docs. Opt-in per repo — the workflow succeeds vacuously
  # without a map, so this job is safe for every consumer from day one.
  # Local ./ reference resolves from THIS repository (same proven pattern
  # as the language jobs above).
  docs-drift:
    uses: ./.github/workflows/docs-drift.yml

  # Universal merge gate: every repository consuming devtools exposes
  # exactly this context to the org ruleset. Composition may evolve; the
  # contract ("gate green = mergeable") does not.
  gate:
    timeout-minutes: 15
    name: gate
    needs: [core, rust, elixir, typescript, python, docs-drift]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all gates passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs results: $RESULTS"
          for result in $RESULTS; do
            # "skipped" is a designed outcome, not a failure: the language
            # stack jobs never skip (they detect their stack internally and
            # conclude SUCCESS vacuously when absent), test-postgis skips
            # when no PostGIS image is requested, docs-drift skips on push
            # events. Only failure / cancelled / timed_out block the gate.
            if [ "$result" != "success" ] && [ "$result" != "skipped" ]; then
              echo "::error::gate did not succeed: $result"
              exit 1
            fi
          done
          echo "all gates passed"