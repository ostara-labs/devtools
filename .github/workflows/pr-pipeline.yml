name: PR pipeline

# devtools self-adoption: the hub reviews its own PRs with the same
# pipeline it ships to the consumers (pia, bot, messenger-assistant,
# home, world-monitor-tui). The ci job calls the aggregate IN THIS
# repository (same-repo cross-ref, legal); it DUPLICATES the aggregate's
# own pull_request self-run. The required "gate" context is reported by
# that self-run and the composite "ci / gate" by this caller job; the
# devtools ruleset requires both. Collapsing the duplication is a further
# ruleset change. Cleanup deferred until then.
#
# The pull_request event flows through github.event into every callee --
# no workflow_run, no context loss. Docs: docs/ai-review.md.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
  # Merge-queue entries. The queue tests the PR merged onto the current base
  # BEFORE merging it, so the required contexts must report here too:
  # `ci / gate` does, and `merge-gate` is adapted below. The review is not
  # re-run in the queue — the PR only gets in with its checks green.
  merge_group:

concurrency:
  group: pr-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ci:
    name: ci
    permissions:
      contents: read
    uses: ostara-labs/devtools/.github/workflows/ci.yml@b5d3237e80525ebd8b2be3f1356d3b83801a683c # v1.12.1

  # Self-adoption, like the ci job above: the hub classifies its own PRs with
  # the workflow it ships. pull_request only - a push or a merge-queue entry
  # has no pull request to read, and the job would have nothing to label.
  pr-meta:
    name: pr-meta
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      pull-requests: write
    uses: ostara-labs/devtools/.github/workflows/pr-meta.yml@29c469173a385094bc8cf6f01f5428700eaf23d6 # single-job pr-meta, replaced by the release tag

  ai-review:
    name: ai-review
    needs: ci
    if: ${{ !cancelled() && needs.ci.result == 'success' && github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ostara-labs/devtools/.github/workflows/ai-review.yml@b5d3237e80525ebd8b2be3f1356d3b83801a683c # v1.12.1
    secrets:
      AI_REVIEW_OPENROUTER_API_KEY: ${{ secrets.AI_REVIEW_OPENROUTER_API_KEY }}

  merge-gate:
    timeout-minutes: 15
    name: merge-gate
    needs: [ci, ai-review]
    # Two shapes. On pull_request: the real verdict. On merge_group: the entry
    # only exists because the PR's required checks were green, so the review is
    # already settled — hardcoding 'success' is a statement about the queue's
    # precondition, not a bypass. The label list is passed as '[]' because a
    # merge-queue entry has no labels and the verdict action would choke on
    # `jq` over a null array.
    if: ${{ !cancelled() && (github.event_name == 'merge_group' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verdict
        uses: ostara-labs/devtools/.github/actions/merge-gate-verdict@b5d3237e80525ebd8b2be3f1356d3b83801a683c # v1.12.1
        with:
          ci-result: ${{ needs.ci.result }}
          review-result: ${{ github.event_name == 'merge_group' && 'success' || needs.ai-review.result }}
          draft: ${{ github.event.pull_request.draft }}
          labels: ${{ github.event_name == 'merge_group' && '[]' || toJSON(github.event.pull_request.labels.*.name) }}
