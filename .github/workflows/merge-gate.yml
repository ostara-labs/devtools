name: Merge gate

# Reusable merge-decision gate — the single required check that combines
# the three merge conditions agreed for ostara-labs:
#   1. CI passed (the repo's CI workflow, latest run on this head SHA)
#   2. AI review passed (the review workflow, latest run on this head SHA)
#   3. no blocking label on the PR (default: "possible security issue",
#      "size/too-big" — removed by an authorized human = audited override)
#
# Rendez-vous WITHOUT cross-context lookups: the caller fires this gate
# when the repo's CI workflow completes (on a pull_request run) and on
# `unlabeled`. The CI checks and the ai-review check both exist as check
# runs ON the PR head SHA (the review publishes its own `ai-review`
# check), so every verdict input is read from the head SHA itself:
#   - a review check not completed yet -> exit silently: the merge-gate
#     check is left ABSENT, which blocks the merge until the review
#     publishes (a missing required check never reports)
#   - everything terminal -> one completed "merge-gate" check run is
#     created on the head SHA with the verdict and the reasons
#
# The check run is created via the API (not a job) because workflow_run
# runs are not attached to the PR head SHA.

on:
  workflow_call:
    inputs:
      head-branch:
        description: 'PR head branch (from the triggering workflow_run event)'
        required: false
        type: string
        default: ''
      blocking-labels:
        description: 'JSON array of PR labels that block the merge'
        required: false
        type: string
        default: '["possible security issue", "size/too-big"]'

jobs:
  gate:
    name: gate-dispatch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      checks: write
      contents: read
      pull-requests: read
    steps:
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
        run: |
          set -euo pipefail
          # No PR (push to main, closed PR): nothing to gate — exit without
          # creating any check.
          if [ -n "${HEAD_BRANCH}" ] && [ "${HEAD_BRANCH}" != "null" ]; then
            PR_NUMBER="$(gh api "repos/${REPO}/pulls?head=${REPO%%/*}:${HEAD_BRANCH}&state=open" --jq '.[0].number // ""')"
          fi
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_JSON="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          {
            echo "skip=false"
            echo "pr=${PR_NUMBER}"
            echo "head_sha=$(echo "${PR_JSON}" | jq -r .head.sha)"
          } >> "$GITHUB_OUTPUT"

      - name: Evaluate merge conditions
        id: eval
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          BLOCKING_LABELS: ${{ inputs.blocking-labels }}
          PR: ${{ steps.ctx.outputs.pr }}
        run: |
          set -euo pipefail
          # 1. CI condition: every check on the head SHA except our own
          #    (ai-review / merge-gate) is completed and success/skipped.
          #    The caller fires this gate when the CI workflow completes,
          #    so CI is terminal by construction — this re-check makes the
          #    verdict robust against extra firings.
          checks() {
            gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              | jq -r '[.check_runs[] | select((.name | ascii_downcase) as $n | ($n == "ai-review" or $n == "merge-gate") | not)]'
          }
          RUNS="$(checks)"
          # Bounded wait: other workflows (pr-meta, classify...) triggered
          # by the same push may complete AFTER the CI workflow that fired
          # this gate. Pending checks are "not yet", not "failed".
          for i in $(seq 1 20); do
            CI_PEND="$(echo "${RUNS}" | jq '[.[] | select(.status != "completed")] | length')"
            [ "${CI_PEND}" -eq 0 ] && break
            echo "waiting for ${CI_PEND} pending CI check(s) (${i}/20)"
            sleep 30
            RUNS="$(checks)"
          done
          CI_FAIL="$(echo "${RUNS}" | jq '[.[] | select(.conclusion != "success" and .conclusion != "skipped")] | length')"
          if [ "${CI_FAIL}" -gt 0 ]; then
            {
              echo "decision=failure"
              echo "title=CI not green"
              echo "summary=Condition 1 failed: ${CI_FAIL} failing CI check(s) on this commit."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Review condition: wait (bounded) for the ai-review check on
          #    this head SHA. The caller fires the gate on CI completion,
          #    which is BEFORE the review finishes — the absence of the
          #    check means "not yet", never "failed".
          for i in $(seq 1 26); do
            AI_CHECK="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/check-runs?per_page=100" \
              | jq -r '[.check_runs[] | select((.name | ascii_downcase) == "ai-review")][0] // ""')"
            if [ -n "${AI_CHECK}" ] && [ "$(echo "${AI_CHECK}" | jq -r .status)" = "completed" ]; then
              break
            fi
            echo "waiting for the ai-review check (${i}/26)"
            sleep 30
          done
          if [ -z "${AI_CHECK}" ] || [ "$(echo "${AI_CHECK}" | jq -r .status)" != "completed" ]; then
            {
              echo "decision=failure"
              echo "title=review did not complete in time"
              echo "summary=Condition 2 failed: the ai-review check did not complete within the gate window (~13 min). Re-run this check once the review lands."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AI_CONCLUSION="$(echo "${AI_CHECK}" | jq -r '.conclusion // "failure"')"
          if [ "${AI_CONCLUSION}" != "success" ]; then
            {
              echo "decision=failure"
              echo "title=review ${AI_CONCLUSION}"
              echo "summary=Condition 2 failed: the ai-review check concluded ${AI_CONCLUSION}."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Blocking-label condition.
          LABELS="$(gh api "repos/${REPO}/pulls/${PR}" --jq '[.labels[].name]')"
          HIT="$(echo "${LABELS}" | jq -r --argjson blocking "${BLOCKING_LABELS}" \
            '[.[] | select(. as $l | $blocking | index($l))] | length')"
          if [ "${HIT}" -gt 0 ]; then
            {
              echo "decision=failure"
              echo "title=blocking label present"
              echo "summary=Condition 3 failed: blocking label(s) ${LABELS} on the PR. Fix the findings, or remove the label to record a deliberate override."
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "decision=success"
            echo "title=all three conditions met"
            echo "summary<<SUMMARY_EOF"
            echo "Mergeable: CI green + AI review done + no blocking label."
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report merge-gate check
        if: steps.ctx.outputs.skip != 'true' && steps.eval.outputs.decision != 'wait'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
          DECISION: ${{ steps.eval.outputs.decision }}
          TITLE: ${{ steps.eval.outputs.title }}
          SUMMARY: ${{ steps.eval.outputs.summary }}
        run: |
          set -euo pipefail
          jq -n --arg sha "${HEAD_SHA}" \
                --arg conclusion "${DECISION}" \
                --arg title "${TITLE}" \
                --arg summary "${SUMMARY}" \
                '{name: "merge-gate", head_sha: $sha, status: "completed",
                  conclusion: $conclusion,
                  output: {title: $title, summary: $summary}}' \
          | gh api "repos/${REPO}/check-runs" --input -
