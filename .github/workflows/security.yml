name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # gitleaks-action requires a paid license on organization repos; run the
      # binary directly instead (checksum-verified download).
      - name: Install gitleaks
        shell: bash
        run: |
          curl -sSfL -o gitleaks_8.28.0_linux_x64.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          curl -sSfL -o checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_checksums.txt
          grep "gitleaks_8.28.0_linux_x64.tar.gz" checksums.txt | sha256sum --check --status -
          tar -xzf gitleaks_8.28.0_linux_x64.tar.gz gitleaks

      - name: Scan for secrets (full history)
        run: ./gitleaks git --verbose --redact --exit-code 1 .

  scorecard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
      id-token: write
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_format: sarif
          results_file: scorecard.sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-sarif
          path: scorecard.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: scorecard.sarif
