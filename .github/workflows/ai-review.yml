name: AI review

# Reusable AI PR-reviewer (PR-Agent + OpenRouter) — review ONLY, no merge
# decision. The merge decision lives in merge-gate.yml (rendez-vous of CI
# and this workflow + blocking labels), consumed by a thin caller per repo
# — same convergence model as ci.yml / pr-meta.yml.
#
# Contract (agreed 2026-09-06/07, replaces CodeRabbit on ostara-labs):
#   - the CALLER triggers this via `workflow_run` on the repo's CI — it
#     starts only when CI has completed, so no polling and no compute
#     spent on waiting
#   - only non-draft open PRs are reviewed (drafts cost zero model spend)
#   - reviewer calibration is per repo, in .pr_agent.toml (repo AGENTS.md
#     at the root is picked up automatically); model routing is an input
#
# Blocking labels are NOT checked here — merge-gate.yml owns them.

on:
  workflow_call:
    inputs:
      head-branch:
        description: 'PR head branch (from the triggering workflow_run event)'
        required: false
        type: string
        default: ''
      pr-number:
        description: 'PR number (alternative to head-sha, e.g. label-triggered runs)'
        required: false
        type: string
        default: ''
      model:
        description: 'Primary model (LiteLLM notation). Empty = default below.'
        required: false
        type: string
        default: 'openrouter/deepseek/deepseek-v4-flash'
      fallback-models:
        description: 'JSON array of fallback models. Empty = default below.'
        required: false
        type: string
        default: '["openrouter/z-ai/glm-5.3-flash"]'
    secrets:
      AI_REVIEW_OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ inputs.head-branch }}
          PR_NUMBER: ${{ inputs.pr-number }}
          MODEL_INPUT: ${{ inputs.model }}
          FALLBACK_INPUT: ${{ inputs.fallback-models }}
        run: |
          set -euo pipefail
          # Every exit path is a graceful skip: this workflow makes no
          # merge decision, so silence is safe — merge-gate.yml decides.
          if [ -n "${HEAD_BRANCH}" ] && [ "${HEAD_BRANCH}" != "null" ]; then
            # Find the open PR for this head branch (the caller passes the
            # branch of the triggering CI run — stable across contexts).
            PR_NUMBER="$(gh api "repos/${REPO}/pulls?head=${REPO%%/*}:${HEAD_BRANCH}&state=open" --jq '.[0].number // ""')"
          fi
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=No open PR for this branch (push to a branch or main)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PR_JSON="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")"
          DRAFT="$(echo "${PR_JSON}" | jq -r .draft)"
          STATE="$(echo "${PR_JSON}" | jq -r .state)"
          if [ "${DRAFT}" != "false" ] || [ "${STATE}" != "open" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=PR is a draft (${DRAFT}) or not open (${STATE})" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "skip=false"
            echo "pr=${PR_NUMBER}"
            echo "head_sha=$(echo "${PR_JSON}" | jq -r .head.sha)"
          } >> "$GITHUB_OUTPUT"
          # Model routing: explicit input wins, else the defaults above.
          if [ -n "${MODEL_INPUT}" ]; then
            echo "MODEL=${MODEL_INPUT}" >> "$GITHUB_ENV"
          else
            echo "MODEL=openrouter/deepseek/deepseek-v4-flash" >> "$GITHUB_ENV"
          fi
          if [ -n "${FALLBACK_INPUT}" ]; then
            echo "FALLBACK_MODELS=${FALLBACK_INPUT}" >> "$GITHUB_ENV"
          else
            echo "FALLBACK_MODELS=[\"openrouter/z-ai/glm-5.3-flash\"]" >> "$GITHUB_ENV"
          fi

      - name: Run PR-Agent review
        if: steps.ctx.outputs.skip != 'true'
        # Expressions are not allowed in a step-level `uses:` — the ref is
        # hardcoded. Pin for production with the Docker form instead:
        #   uses: docker://pragent/pr-agent:<version>-github_action
        # (digest-pinnable, GitHub Artifact Attestations verifiable).
        uses: the-pr-agent/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER.KEY: ${{ secrets.AI_REVIEW_OPENROUTER_API_KEY }}
          CONFIG.MODEL: ${{ env.MODEL }}
          CONFIG.FALLBACK_MODELS: ${{ env.FALLBACK_MODELS }}
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'false'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'

      - name: Publish ai-review check
        if: steps.ctx.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ steps.ctx.outputs.head_sha }}
        run: |
          set -euo pipefail
          # The review's terminal state, published as a check on the PR
          # head SHA. merge-gate.yml waits for THIS check (workflow_run
          # runs live in the default-branch context — their head_sha is
          # NOT the PR head, so run-based lookups cannot be used).
          jq -n --arg sha "${HEAD_SHA}" \
                '{name: "ai-review", head_sha: $sha, status: "completed",
                  conclusion: "success",
                  output: {title: "review completed",
                           summary: "PR-Agent posted its review on this PR."}}' \
          | gh api "repos/${REPO}/check-runs" --input - >/dev/null
          echo "ai-review check published on ${HEAD_SHA}"
