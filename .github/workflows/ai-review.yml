name: AI review

# Reusable AI PR-reviewer (PR-Agent + OpenRouter). Called as a DAG job by
# the consumer's PR pipeline AFTER its CI job succeeded — the caller's
# pull_request event flows through verbatim (github.event.pull_request
# is the PR), so there is no context passing, no check-run publication
# and no polling: this workflow only runs PR-Agent.
#
# Tools: /review (summary findings + merge recommendation + labels) and
# /improve (anchored, committable inline suggestions above the score
# threshold). Reviewer calibration is org-wide in
# ostara-labs/pr-agent-settings/.pr_agent.toml, overridable per repo in
# a local .pr_agent.toml (AGENTS.md is picked up automatically). Model
# routing is an input.

on:
  workflow_call:
    inputs:
      model:
        description: 'Primary model (LiteLLM notation)'
        required: false
        type: string
        default: 'openrouter/deepseek/deepseek-v4-flash'
      fallback-models:
        description: 'JSON array of fallback models'
        required: false
        type: string
        default: '["openrouter/z-ai/glm-5.3-flash"]'
    secrets:
      AI_REVIEW_OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Run PR-Agent review
        uses: the-pr-agent/pr-agent@main
        # Expressions are not allowed in a step-level `uses:` — the ref is
        # hardcoded. Pin for production with the Docker form instead:
        #   uses: docker://pragent/pr-agent:<version>-github_action
        # (digest-pinnable, GitHub Artifact Attestations verifiable).
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER.KEY: ${{ secrets.AI_REVIEW_OPENROUTER_API_KEY }}
          CONFIG.MODEL: ${{ inputs.model != '' && inputs.model || 'openrouter/deepseek/deepseek-v4-flash' }}
          CONFIG.FALLBACK_MODELS: ${{ inputs.fallback-models != '' && inputs.fallback-models || '["openrouter/z-ai/glm-5.3-flash"]' }}
          # Persistent finding state requires a verifiable GitHub user
          # identity, which the Actions token cannot provide — PR-Agent
          # exits 1 on it (observed 2026-09-07). Off org-wide; consumers
          # can re-enable per repo in .pr_agent.toml if they ever run the
          # review with a full GitHub App identity.
          PR_REVIEWER.PERSISTENT_FINDING_STATE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          # /improve publishes anchored, committable suggestions above the
          # score threshold as inline review threads (config lives in the
          # org-wide ostara-labs/pr-agent-settings .pr_agent.toml).
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'true'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
