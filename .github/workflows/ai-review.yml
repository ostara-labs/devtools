name: AI review

# Reusable AI PR-reviewer (PR-Agent + OpenRouter). Called as a DAG job by
# the consumer's PR pipeline AFTER its CI job succeeded — the caller's
# pull_request event flows through verbatim (github.event.pull_request
# is the PR), so there is no context passing, no check-run publication
# and no polling: this workflow only runs PR-Agent.
#
# Tools: /review (summary findings + merge recommendation + labels) and
# /improve (anchored, committable inline suggestions above the score
# threshold). Reviewer calibration is org-wide in
# ostara-labs/pr-agent-settings/.pr_agent.toml, overridable per repo in
# a local .pr_agent.toml (AGENTS.md is picked up automatically). Model
# routing is an input.

on:
  workflow_call:
    inputs:
      model:
        description: 'Primary model (LiteLLM notation)'
        required: false
        type: string
        default: 'openrouter/deepseek/deepseek-v4-flash'
      fallback-models:
        description: 'JSON array of fallback models'
        required: false
        type: string
        default: '["openrouter/z-ai/glm-5.3-flash"]'
    secrets:
      AI_REVIEW_OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Dependabot pull requests are exempt. Their titles and bodies are
    # machine-generated ("Bump X from A to B") and the diff is a version
    # number: there is no prose to review and nothing to improve. Reviewing
    # them spends the OpenRouter quota on mechanical bumps, and makes every
    # bump wait on a 240 MB container pull.
    #
    # The exemption does not block the merge: `merge-gate` treats a skipped
    # review as settled when CI succeeded - see merge-gate-verdict. A review
    # that FAILS still fails the gate; only a deliberate skip passes.
    if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Preflight — OpenRouter credential
        # A missing or rejected credential is the one failure that looks like a
        # working reviewer from the outside: PR-Agent reports it as a LiteLLM
        # stack trace, and the only signal is the red check. Name the cause here
        # instead. The env name contains a dot, so it cannot be read as a shell
        # variable — printenv is the way in.
        env:
          OPENROUTER.KEY: ${{ secrets.AI_REVIEW_OPENROUTER_API_KEY }}
        run: |
          key="$(printenv 'OPENROUTER.KEY' || true)"
          if [ -z "${key}" ]; then
            echo "::error::AI_REVIEW_OPENROUTER_API_KEY is empty — the org secret is missing or not shared with this repository, so the review cannot authenticate."
            exit 1
          fi
          status="$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer ${key}" \
            https://openrouter.ai/api/v1/auth/key || true)"
          case "${status}" in
            200) echo "OpenRouter credential accepted." ;;
            401) echo "::error::OpenRouter rejected the credential (HTTP 401) — rotate the org secret AI_REVIEW_OPENROUTER_API_KEY."; exit 1 ;;
            *) echo "::warning::OpenRouter auth check returned HTTP ${status}; the review step reports the real outcome." ;;
          esac

      - name: Run PR-Agent review
        # 0.45.0-github_action (released 2026-09-05), digest-pinned. The floating
        # the-pr-agent/pr-agent@main ref this replaces shipped an upstream
        # regression on 2026-09-15: LiteLLM 1.101.0 stopped forwarding the
        # request-local OpenRouter key, so every review died with a 401 while the
        # check stayed red and blocked merges org-wide. A released, immutable
        # image is what a production gate needs, and the org Renovate preset
        # (default.json) tracks the tag, so the pin cannot freeze silently.
        uses: docker://pragent/pr-agent@sha256:548b760b81ab4b3f729182428695ccc1194bbf87528c2b1e2b2b07e5223af7b6
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OPENROUTER.KEY: ${{ secrets.AI_REVIEW_OPENROUTER_API_KEY }}
          CONFIG.MODEL: ${{ inputs.model != '' && inputs.model || 'openrouter/deepseek/deepseek-v4-flash' }}
          CONFIG.FALLBACK_MODELS: ${{ inputs.fallback-models != '' && inputs.fallback-models || '["openrouter/z-ai/glm-5.3-flash"]' }}
          # Persistent finding state requires a verifiable GitHub user
          # identity, which the Actions token cannot provide — PR-Agent
          # exits 1 on it (observed 2026-09-07). Off org-wide; consumers
          # can re-enable per repo in .pr_agent.toml if they ever run the
          # review with a full GitHub App identity.
          PR_REVIEWER.PERSISTENT_FINDING_STATE: 'false'
          GITHUB_ACTION_CONFIG.AUTO_REVIEW: 'true'
          GITHUB_ACTION_CONFIG.AUTO_DESCRIBE: 'false'
          # /improve publishes anchored, committable suggestions above the
          # score threshold as inline review threads (config lives in the
          # org-wide ostara-labs/pr-agent-settings .pr_agent.toml).
          GITHUB_ACTION_CONFIG.AUTO_IMPROVE: 'true'
          GITHUB_ACTION_CONFIG.PR_ACTIONS: '["opened", "reopened", "ready_for_review", "synchronize"]'
          # A tool error must fail the step. PR-Agent swallows it by default
          # (propagate_tool_errors=false): the tool publishes a "Failed to
          # generate ..." comment, returns normally, and the job exits 0 — so a
          # dead reviewer was indistinguishable from a clean one. Observed
          # 2026-09-13/14: a provisioning OpenRouter key returned 401 on every
          # call while the check stayed green on every PR. With this on, a
          # failed review fails the job, `merge-gate` fails with it, and the PR
          # is blocked until the review runs for real.
          CONFIG.PROPAGATE_TOOL_ERRORS: 'true'
