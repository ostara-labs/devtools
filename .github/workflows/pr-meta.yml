name: PR meta

# Reusable PR classification so humans never tick boxes for things a
# machine computes better. Called by each repository's thin
# .github/workflows/pr-meta.yml on pull_request events:
#
#   jobs:
#     pr-meta:
#       uses: ostara-labs/devtools/.github/workflows/pr-meta.yml@<sha>
#
#   - title  : enforces Conventional Commits on the PR title (blocking;
#              skipped for Dependabot PRs — their titles are machine-
#              generated "Bump ..." strings that no lint should gate)
#   - size   : labels size/S|size/M|size/L|size/XL from the diff
#   - risk   : labels risk/low|risk/medium|risk/high (trust-boundary files
#              => risk/high; docs-only => risk/low)
#
# The event context is the caller's: github.event is the pull_request that
# triggered the caller, and actions/checkout inside this workflow checks
# out the caller's repository (needed by the risk job, which reads the
# caller's .github/trust-boundary.yml).
#
# Fork pull requests: title still runs (read-only check); size and risk
# are computed and published in the job summary only (the default token
# is read-only there, so no labels/comments). The caller must grant
# `pull-requests: write` for the label writes to land.

on:
  workflow_call:
    inputs:
      too-big-threshold:
        description: 'Added lines (excluding generated/lock files) above which size/too-big is applied and the merge-gate blocks'
        required: false
        type: string
        default: '1000'

jobs:
  title:
    name: title
    runs-on: ubuntu-latest
    steps:
      - name: Check Conventional Commits title
        env:
          TITLE: ${{ github.event.pull_request.title }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # Dependabot titles are machine-generated ("Bump X from A to B",
          # sometimes with a group suffix that also breaks the 100-char
          # cap). Linting them guards nothing — skip the check entirely.
          # Key on the PR AUTHOR, not github.actor: a manual re-run or an
          # `edited` event is triggered by a human account, and linting the
          # title then would fail exactly the PRs this exempts.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "title ok (dependabot, skip lint): $TITLE"
            exit 0
          fi
          pattern='^(Merge |Revert |fixup! )|^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_./-]+\))?(!)?: .{1,}$'
          if [ ${#TITLE} -le 100 ] && echo "$TITLE" | grep -qE "$pattern"; then
            echo "title ok: $TITLE"
          else
            echo "PR title must follow Conventional Commits (and stay under 100 chars):" >&2
            echo "  type(scope)!: subject   e.g. 'feat(rust): add retry loop'" >&2
            echo "  types: feat fix docs style refactor perf test build ci chore revert" >&2
            exit 1
          fi

  size:
    name: size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Compute and apply size label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          TOO_BIG_THRESHOLD: ${{ inputs.too-big-threshold }}
        run: |
          set -euo pipefail
          # Diff data comes straight from the PR files API: checkout runs
          # with persist-credentials: false, so any `git fetch` would die
          # with "could not read Username" (observed on every pia PR since
          # v1.6.0 — 2026-09-06). gh uses GH_TOKEN, no git creds involved.
          #
          # The endpoint caps at 3000 files even with pagination — hitting
          # the cap means the PR is too big by definition (fail closed).
          FILES_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --slurp)"
          file_count="$(echo "${FILES_JSON}" | jq '[.[].[]] | length')"
          # Added lines excluding generated/lock artifacts.
          EXCL='(Cargo\.lock|pnpm-lock\.yaml|mix\.lock|uv\.lock|package-lock\.json|yarn\.lock|go\.sum)$'
          lines_added="$(echo "${FILES_JSON}" | jq --arg re "${EXCL}" \
            '[.[].[] | select((.filename | test($re)) | not) | .additions] | add // 0')"
          lines_total="$(echo "${FILES_JSON}" | jq --arg re "${EXCL}" \
            '[.[].[] | select((.filename | test($re)) | not) | .additions + .deletions] | add // 0')"
          echo "files=${file_count} added=${lines_added} total=${lines_total} threshold=${TOO_BIG_THRESHOLD}"

          if [ "${file_count}" -ge 3000 ] || [ "${lines_added}" -gt "${TOO_BIG_THRESHOLD}" ]; then
            label=size/too-big
          elif [ "${lines_total}" -lt 10 ]; then label=size/S
          elif [ "${lines_total}" -lt 100 ]; then label=size/M
          elif [ "${lines_total}" -lt 500 ]; then label=size/L
          else label=size/XL
          fi
          echo "label: ${label}"

          # Fork PRs get a read-only GITHUB_TOKEN: label/comment writes below
          # would fail with HTTP 403 under set -e. Keep the signal visible:
          # publish the computed size in the job summary instead.
          if [ "$IS_FORK" = "true" ]; then
            {
              echo "## PR size (fork PR — read-only)"
              echo ""
              echo "files=${file_count} added=${lines_added} total=${lines_total} -> \`$label\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ensure_label() {
            gh label create "$1" --color "$2" --force >/dev/null 2>&1 || true
          }
          ensure_label size/too-big b60205
          ensure_label size/S 0e8a16
          ensure_label size/M fbca04
          ensure_label size/L f9d0c4
          ensure_label size/XL d93f0b

          for l in size/too-big size/S size/M size/L size/XL; do
            if [ "$l" != "$label" ]; then
              gh pr edit "$PR_NUMBER" --remove-label "$l" >/dev/null 2>&1 || true
            fi
          done
          gh pr edit "$PR_NUMBER" --add-label "$label" >/dev/null

          if [ "$label" = "size/too-big" ]; then
            {
              echo ":no_entry: This PR adds more than ${TOO_BIG_THRESHOLD} lines (excluding generated/lock files) — or exceeds the 3000-file API cap."
              echo "Split it into independent, mergeable pieces."
              echo ""
              echo "Legitimate large refactors: remove the \`size/too-big\` label — the merge gate re-runs green and records the override."
            } > body.md
            gh pr comment "$PR_NUMBER" --body-file body.md >/dev/null
            rm -f body.md
          elif [ "$label" = "size/XL" ]; then
            {
              echo ':warning: This PR changes **500+ lines**. Large PRs are harder to review thoroughly - consider splitting it into independent, mergeable pieces if the change allows it.'
            } > body.md
            gh pr comment "$PR_NUMBER" --body-file body.md >/dev/null
            rm -f body.md
          fi

  risk:
    name: risk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Compute and apply risk label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail
          # PR files API again — see the size job for why (no git creds).
          changed="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --slurp \
            | jq -r '[.[].[] | .filename] | join("\n")')"
          [ -n "$changed" ] || exit 0

          matches_pattern() {
            local file="$1" pattern
            while IFS= read -r pattern; do
              [ -n "$pattern" ] || continue
              # shellcheck disable=SC2053
              if [[ "$file" == $pattern ]]; then return 0; fi
            done < <(sed -E 's/^[[:space:]]*-[[:space:]]*//' .github/trust-boundary.yml | grep -v '^[[:space:]]*$' | grep -v '^#')
            return 1
          }

          high=0; docs_only=1
          while IFS= read -r file; do
            if matches_pattern "$file"; then high=1; fi
            if ! echo "$file" | grep -qE '(^docs/|\.md$)'; then docs_only=0; fi
          done <<< "$changed"

          if [ "$high" -eq 1 ]; then label=risk/high
          elif [ "$docs_only" -eq 1 ]; then label=risk/low
          else label=risk/medium
          fi
          echo "risk: $label"

          # Fork PRs get a read-only GITHUB_TOKEN: label writes below would
          # fail with HTTP 403 under set -e. Keep the signal visible: publish
          # the computed risk in the job summary instead.
          if [ "$IS_FORK" = "true" ]; then
            {
              echo "## PR risk (fork PR — read-only)"
              echo ""
              echo "risk: \`$label\`"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          ensure_label() {
            gh label create "$1" --color "$2" --force >/dev/null 2>&1 || true
          }
          ensure_label risk/low 0e8a16
          ensure_label risk/medium fbca04
          ensure_label risk/high d93f0b

          for l in risk/low risk/medium risk/high; do
            if [ "$l" != "$label" ]; then
              gh pr edit "$PR_NUMBER" --remove-label "$l" >/dev/null 2>&1 || true
            fi
          done
          gh pr edit "$PR_NUMBER" --add-label "$label" >/dev/null