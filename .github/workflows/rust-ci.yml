name: Rust CI

on:
  workflow_call:
    inputs:
      stack-dir:
        description: "Directory containing this stack's manifest (Cargo.toml / package.json / mix.exs / pyproject.toml)"
        required: false
        type: string
        default: "rust"

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-24.04
    env:
      STACK_DIR: ${{ inputs['stack-dir'] }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Rust stack
        id: detect
        shell: bash
        run: |
          if [ -f "$STACK_DIR/Cargo.toml" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust toolchain
        if: steps.detect.outputs.present == 'true'
        uses: dtolnay/rust-toolchain@stable # trusted moving-ref exception: kept for auto-updating toolchain
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        if: steps.detect.outputs.present == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ${{ inputs['stack-dir'] }}

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: cd "$STACK_DIR" && cargo fmt --all -- --check && cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: cd "$STACK_DIR" && cargo test
