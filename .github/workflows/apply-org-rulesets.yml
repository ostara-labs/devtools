name: Apply Org Rulesets

# Applies the org-level rulesets from scripts/setup-org-rulesets.sh, which is
# what actually owns `main-protection` on GitHub.
#
# WHY NOT PULUMI. infra/rulesets/ declared five rulesets and applied none:
# `deploy-rulesets` never once reached `Preview`, failing every run while
# building the gcpkms secrets manager. The failure is upstream —
# pulumi/pulumi#11591 describes this exact setup ("remote gcp bucket and gcp
# kms for state") and has been open since 2022-12-08 with no assignee; the
# reported workaround, that only the SECOND run fails, matches what was
# observed here. Pinning the CLI to the version that works locally reproduced
# the failure identically, so no version of this workflow can fix it.
#
# The script carries none of the layers that bug lives in: no state, no KMS,
# no secrets to decrypt. It is idempotent — PUT when a ruleset exists, POST
# when it does not — so running it repeatedly converges.
#
# WHY THIS WORKFLOW EXISTS AT ALL. The script was manual, and that is what
# produced the divergence found on 2026-10-04: both declarations said
# `required_review_thread_resolution: true` since #86 while the live ruleset
# kept `false`, because nothing re-ran the script. A manual applier is an
# applier that gets forgotten.
#
# Auth: a GitHub App installation token, NOT an `admin:org` PAT. The App
# carries exactly the "Administration: write" organization permission the
# rulesets API requires, the token is minted per run and expires, and there is
# nothing to rotate. Same mechanism drift-scan, health-check and renovate use.

on:
  push:
    branches: [main]
    paths:
      - "scripts/setup-org-rulesets.sh"
      - "infra/rulesets-tf/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-org-rulesets
  cancel-in-progress: false

jobs:
  apply:
    name: apply
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RULESETS_APP_ID }}
          private-key: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Apply the org rulesets
        env:
          # The script calls `gh api`, which reads GH_TOKEN. Nothing else in it
          # needs changing to run under an installation token.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: bash scripts/setup-org-rulesets.sh "${{ github.repository_owner }}"

      - name: Report what is live
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          echo "=== rulesets on the org after the apply ==="
          gh api "/orgs/${{ github.repository_owner }}/rulesets" \
            --jq '.[] | .name + "  target=" + .target + "  " + .enforcement'
