name: Elixir CI

on:
  workflow_call:
    inputs:
      stack-dir:
        description: "Directory containing this stack's manifest (Cargo.toml / package.json / mix.exs / pyproject.toml)"
        required: false
        type: string
        default: "elixir"

permissions:
  contents: read

jobs:
  elixir:
    runs-on: ubuntu-24.04
    env:
      STACK_DIR: ${{ inputs['stack-dir'] }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Elixir stack
        id: detect
        shell: bash
        run: |
          if [ -f "$STACK_DIR/mix.exs" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Beam
        if: steps.detect.outputs.present == 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs['stack-dir'] }}/deps
          key: mix-deps-27-1.18-${{ hashFiles(format('{0}/mix.lock', inputs['stack-dir'])) }}
          restore-keys: |
            mix-deps-27-1.18-

      - name: Cache build
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs['stack-dir'] }}/_build
          key: mix-build-27-1.18-${{ hashFiles(format('{0}/mix.lock', inputs['stack-dir'])) }}
          restore-keys: |
            mix-build-27-1.18-

      - name: Check
        if: steps.detect.outputs.present == 'true'
        run: cd "$STACK_DIR" && mix deps.get && mix format --check-formatted && mix credo --strict && mix test
