name: Elixir CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  elixir:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Detect Elixir stack
        id: detect
        shell: bash
        run: |
          if [ -f elixir/mix.exs ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Beam
        if: steps.detect.outputs.present == 'true'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: Cache deps
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: elixir/deps
          key: mix-deps-27-1.18-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            mix-deps-27-1.18-

      - name: Cache build
        if: steps.detect.outputs.present == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: elixir/_build
          key: mix-build-27-1.18-${{ hashFiles('elixir/mix.lock') }}
          restore-keys: |
            mix-build-27-1.18-

      - name: Check
        if: steps.detect.outputs.present == 'true'
        run: cd elixir && mix deps.get && mix format --check-formatted && mix credo --strict && mix test
