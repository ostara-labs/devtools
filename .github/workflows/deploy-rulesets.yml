name: Deploy Rulesets

# Pulumi deployment for the org rulesets — server-side enforcement that no
# repository can bypass, including org admins.
#
# WHY THIS EXISTS. The Pulumi program in infra/rulesets/ had never been applied:
# no stack existed in the backend, Pulumi.dev.yaml (which `pulumi stack init`
# creates) was absent, and no workflow ran `pulumi up`. While it described a
# policy, scripts/setup-org-rulesets.sh quietly applied a different one by hand.
# This workflow is what makes the declaration authoritative.
#
# ORDER MATTERS: the rulesets a repository depends on must exist before the
# declared shape is applied, or the plan shows creations that fight the live
# state. The stack is selected (never recreated) below, and a preview runs
# before the update so the plan is in the log for every deploy.
#
# Trust boundary: .github/workflows/ is trust-boundary in this repo, and the
# rulesets themselves govern every repository — so a change to this file or to
# infra/rulesets/ needs human review before merge.
#
# Required GitHub secrets (same as the bot repo's infra deploy):
#   GCP_WORKLOAD_IDENTITY_PROVIDER — WIF pool provider resource name
#   GCP_SERVICE_ACCOUNT_EMAIL      — builder SA email
#
# Pulumi backend: gs://ostara-labs-rulesets-state, a bucket in the org-level GCP
# project this plan owns. It is deliberately NOT gs://agent-pulumi-state: that
# bucket belongs to the bot project and holds the bot-infra stack, and a policy
# governing all eleven repositories should not live inside the project of one
# of its consumers.
#
# The project and bucket must exist before this workflow can run — see
# docs/setup-guide.md, "Step 0 — Create the org infrastructure project".
# Pulumi secrets: GCP KMS key pulumi-stack-encryption in that same project.

on:
  push:
    branches: [main]
    paths:
      - "infra/rulesets/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # The org infrastructure project, NOT ostara-labs-bot. The rulesets' state
  # bucket and KMS key live there deliberately: a policy governing all eleven
  # repositories should not sit inside the GCP project of one of them. Copying
  # this workflow from the bot repo's infra deploy left these pointing at the
  # bot project, and the first apply failed on
  # "cloudkms.cryptoKeyVersions.useToEncrypt denied on projects/ostara-labs-bot".
  GCP_PROJECT: ostara-labs-infra
  GCP_REGION: europe-west1
  PULUMI_BACKEND: gs://ostara-labs-rulesets-state
  PULUMI_KMS_KEY: gcpkms://projects/ostara-labs-infra/locations/europe-west1/keyRings/pulumi/cryptoKeys/pulumi-stack-encryption
  STACK: devtools-rulesets

jobs:
  pulumi-up:
    name: Pulumi preview and up
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          # Pinned, not `latest`. With the floating version the CLI could not
          # build the gcpkms secrets manager for a stack whose state is
          # demonstrably readable: deleting the stack, recreating it, and
          # verifying `config set --secret` plus `config --show-secrets`
          # against it succeeds with v3.251.0 locally, and the SAME stack then
          # fails in CI with the very same state. The variable that differs is
          # the client, so it is the client that gets fixed here.
          pulumi-version: 3.251.0

      - name: Configure Pulumi backend
        run: pulumi login "$PULUMI_BACKEND"

      - name: Install npm dependencies
        working-directory: infra/rulesets
        run: npm install

      - name: Select or create the stack
        working-directory: infra/rulesets
        run: |
          # A stale lock from an interrupted run would block every later deploy,
          # so cancel first and tolerate its absence.
          if pulumi stack select "$STACK" 2>/dev/null; then
            pulumi cancel --yes 2>/dev/null || true
            echo "Stack $STACK exists — using it"
          else
            echo "Stack $STACK does not exist — creating with KMS"
            pulumi stack init "$STACK" --secrets-provider="$PULUMI_KMS_KEY"
          fi

      - name: Configure GitHub App credentials
        working-directory: infra/rulesets
        env:
          # A DIFFERENT app from drift-scan's, and named differently on purpose.
          # The drift-scan app holds Contents:read and Issues:write for a
          # read-only weekly audit; this one needs Organization →
          # Administration:read and write, which can rewrite the branch
          # protection of every repository in the org. Sharing one credential
          # would give a scanning app the power to remove the protections it
          # reports on.
          #
          # The names are distinct because RULESETS_APP_ID and its key are what
          # this workflow reads. Reusing DEVTOOLS_APP_ID here would silently
          # repoint drift-scan, health-check and renovate at a different app,
          # since all three read that same variable.
          APP_ID: ${{ vars.RULESETS_APP_ID }}
          APP_INSTALLATION_ID: ${{ vars.RULESETS_APP_INSTALLATION_ID }}
          APP_PRIVATE_KEY: ${{ secrets.RULESETS_APP_PRIVATE_KEY }}
          ORG_OWNER: ${{ github.repository_owner }}
        run: |
          # --path on every appAuth key, and only on those. Without it, `pulumi
          # config set github:appAuth.id` creates a FLAT key named "appAuth.id",
          # not an object `appAuth` with an `id` field. The provider's schema
          # declares appAuth as a `$ref` to type github:config/appAuth:appAuth
          # with required [id, installationId, pemFile], so a flat key is
          # rejected: "`github:appAuth.id` is not a valid configuration key for
          # the github provider". Pulumi's own help states the mechanism:
          #   pulumi config set --path parent.nested value
          #     "will set the value of `parent` to a map `nested: value`".
          #
          # installationId is required by that type and was missing entirely —
          # an App that is not installed on the org has no installation and no
          # rights over its rulesets.
          #
          # github:owner and github:organization are FLAT strings in the schema,
          # so they take no --path. Course is set by the dots: --path builds a
          # nested object only when the key contains one, as the appAuth keys
          # above do.
          #
          # A missing repo variable expands to the empty string, and
          # `pulumi config set` validates nothing against the provider schema —
          # it would store "" happily and the provider would reject it later,
          # during preview, with an error naming neither the variable nor the
          # step. Fail here instead, where the message can say which one.
          : "${APP_ID:?RULESETS_APP_ID repository variable is not set}"
          : "${APP_INSTALLATION_ID:?RULESETS_APP_INSTALLATION_ID repository variable is not set}"
          : "${APP_PRIVATE_KEY:?RULESETS_APP_PRIVATE_KEY secret is not set}"

          # Flat keys written by the runs that predate --path are inert but not
          # harmless: the provider's schema validation rejects them, and a
          # nested write does not remove them. Rm tolerates absence, and the
          # || true keeps an absent key from failing the step.
          pulumi config rm github:appAuth.id >/dev/null 2>&1 || true
          pulumi config rm github:appAuth.installationId >/dev/null 2>&1 || true
          pulumi config rm github:appAuth.pemFile >/dev/null 2>&1 || true

          # Values come from env, never interpolated into the command string: a
          # crafted secret must not be able to inject shell commands.
          pulumi config set --path github:appAuth.id "$APP_ID" --secret
          pulumi config set --path github:appAuth.installationId "$APP_INSTALLATION_ID" --secret
          # The PEM is multi-line, and passing it as an ARGUMENT made Pulumi read
          # its first line ("-----BEGIN ...") as a flag: the apply died on
          # "error: bad flag syntax". Pulumi's own --help names the supported
          # path: "Multi-line values may be set by piping a file to standard in",
          # with --raw to keep the trailing newline. printf is a bash builtin
          # (no argv exposure); the value still comes from the environment.
          printf '%s' "$APP_PRIVATE_KEY" | pulumi config set --path github:appAuth.pemFile --secret --raw
          pulumi config set github:owner "$ORG_OWNER"

      - name: Preview
        working-directory: infra/rulesets
        run: pulumi preview --stack "$STACK" --non-interactive --diff

      - name: Apply
        working-directory: infra/rulesets
        run: pulumi up --stack "$STACK" --non-interactive --yes --skip-preview
