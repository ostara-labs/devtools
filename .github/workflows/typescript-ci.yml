name: TypeScript CI

on:
  workflow_call:
    inputs:
      stack-dir:
        description: "Directory containing this stack's manifest (Cargo.toml / package.json / mix.exs / pyproject.toml)"
        required: false
        type: string
        default: "typescript"

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-24.04
    env:
      STACK_DIR: ${{ inputs['stack-dir'] }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect TypeScript stack and package manager
        id: detect
        shell: bash
        run: |
          if [ ! -f "$STACK_DIR/package.json" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "present=true" >> "$GITHUB_OUTPUT"
          # Package-manager detection: pnpm is the template convention,
          # but org repos predating the template use npm (package-lock.json
          # without pnpm-lock.yaml). pnpm v11 hard-fails on unapproved
          # build scripts in npm-managed trees, so respect the lockfile.
          if [ -f "$STACK_DIR/pnpm-lock.yaml" ]; then
            pm="pnpm"
          elif [ -f "$STACK_DIR/package-lock.json" ]; then
            pm="npm"
          else
            pm="pnpm"
          fi
          echo "pm=$pm" >> "$GITHUB_OUTPUT"
          echo "PM=$pm" >> "$GITHUB_ENV"

      - name: Setup Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Enable corepack
        if: steps.detect.outputs.present == 'true' && env.PM == 'pnpm'
        run: corepack enable
        # Fallback: if corepack is unavailable, install pnpm via `npm install -g pnpm`.

      - name: Set pnpm store path
        if: steps.detect.outputs.present == 'true' && env.PM == 'pnpm'
        run: cd "$STACK_DIR" && echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        if: steps.detect.outputs.present == 'true' && env.PM == 'pnpm'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', inputs['stack-dir'])) }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        if: steps.detect.outputs.present == 'true'
        shell: bash
        run: |
          cd "$STACK_DIR"
          if [ "$PM" = "pnpm" ]; then
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
            else
              pnpm install
            fi
          else
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
          fi

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: cd "$STACK_DIR" && "$PM" run lint

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        run: cd "$STACK_DIR" && "$PM" run typecheck

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: cd "$STACK_DIR" && "$PM" run test

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cd "$STACK_DIR" && "$PM" run build