name: Classify PR

# Labels pull requests that touch trust-boundary files (see
# .github/trust-boundary.yml) with "requires-human-review" and posts a
# comment listing exactly what was touched. Informational only: the actual
# merge gate is the "main-protection" ruleset, which requires code-owner
# approval for those paths.
#
# Fork pull requests run the same detection read-only: the result is
# published in the job summary (no label/comment — the default token is
# read-only there). The merge gate still applies to fork PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  classify:
    name: classify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect trust-boundary changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        run: |
          set -euo pipefail

          git fetch --quiet origin "$BASE_SHA"
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          [ -n "$changed" ] || exit 0

          # Collect changed files matching a configured pattern.
          hits=""
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            while IFS= read -r file; do
              # Glob matching on the right-hand side is intentional: the
              # patterns in trust-boundary.yml are shell globs.
              # shellcheck disable=SC2053
              if [[ "$file" == $pattern ]]; then
                hits+="- \`$file\` (matched \`$pattern\`)"$'\n'
              fi
            done <<< "$changed"
          done < <(sed -E 's/^[[:space:]]*-[[:space:]]*//' .github/trust-boundary.yml | grep -v '^[[:space:]]*$' | grep -v '^#')

          # Fork PRs get a read-only GITHUB_TOKEN: every write below (labels,
          # pr edit, pr comment) would fail with HTTP 403 under set -e. Keep
          # the classification visible: publish a read-only result in the
          # job summary instead.
          if [ "$IS_FORK" = "true" ]; then
            {
              echo "## Trust-boundary classification (fork PR — read-only)"
              echo ""
              if [ -n "$hits" ]; then
                echo "This PR modifies files protected by \`.github/trust-boundary.yml\`:"
                echo ""
                echo "$hits"
                echo ""
                echo "Human approval from a code owner (see CODEOWNERS) is **required** before merge."
              else
                echo "No trust-boundary files touched."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Idempotently ensure the label exists (fresh repos from this
          # template do not have it yet).
          gh label create requires-human-review \
            --color E99695 --description "Touches trust-boundary files" \
            --force >/dev/null 2>&1 || true

          has_label="$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | contains(["requires-human-review"])')"

          if [ -n "$hits" ]; then
            gh pr edit "$PR_NUMBER" --add-label requires-human-review >/dev/null 2>&1 || true
            if [ "$has_label" != "true" ]; then
              {
                echo "## ⚠️ Trust boundary touched"
                echo ""
                echo "This PR modifies files protected by \`.github/trust-boundary.yml\`:"
                echo ""
                echo "$hits"
                echo ""
                echo "Human approval from a code owner (see CODEOWNERS) is **required** before merge."
              } > body.md
              gh pr comment "$PR_NUMBER" --body-file body.md >/dev/null
              rm -f body.md
            fi
          else
            # Not trust-boundary anymore (e.g. files reverted): clear the label.
            if [ "$has_label" = "true" ]; then
              gh pr edit "$PR_NUMBER" --remove-label requires-human-review >/dev/null 2>&1 || true
            fi
          fi
