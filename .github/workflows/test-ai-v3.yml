name: Test ai v3

# BISECT v3: identical to ai-review.yml MINUS the PR-Agent step entirely
# (no `uses:` action step). If v3 parses where the original
# startup_fails, the action step is the rejected construct.

on:
  workflow_call:
    inputs:
      head-sha:
        description: 'PR head SHA (from the triggering workflow_run event)'
        required: false
        type: string
        default: ''
      pr-number:
        description: 'PR number (alternative to head-sha, e.g. label-triggered runs)'
        required: false
        type: string
        default: ''
    secrets:
      AI_REVIEW_OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    name: review
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Resolve PR context
        id: ctx
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ inputs.head-sha }}
          PR_NUMBER: ${{ inputs.pr-number }}
        run: |
          set -euo pipefail
          if [ -n "${HEAD_SHA}" ] && [ "${HEAD_SHA}" != "null" ]; then
            PR_NUMBER="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '[.[] | select(.state == "open")][0].number // ""')"
          fi
          if [ -z "${PR_NUMBER}" ] || [ "${PR_NUMBER}" = "null" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "reason=No open PR for this commit (push to a branch or main)" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "skip=false"
            echo "pr=${PR_NUMBER}"
          } >> "$GITHUB_OUTPUT"
