name: Diagnose Rulesets Stack

# READ-ONLY diagnostic for the deploy-rulesets failure.
#
# WHAT IT EXISTS FOR. Four applies have reached further each time and then died:
#
#   1. Pulumi.yaml declared config keys with no value            (#88)
#   2. the KMS pointed at ostara-labs-bot                        (#90)
#   3. the App PEM was passed as an argv argument                (#92)
#   4. "passphrase must be set with PULUMI_CONFIG_PASSPHRASE"    (unexplained)
#
# The fourth is the one that cannot be fixed by guessing: the stack's own state
# records secrets_provider type "cloud" with a gcpkms url in ostara-labs-infra,
# and an encryptedkey is present — so encryption demonstrably worked once. A
# passphrase prompt on a cloud-provider stack contradicts that, and the
# contradiction has to be OBSERVED, not inferred.
#
# This workflow writes NOTHING. It runs no `up`, no `cancel`, no `config set`,
# no `stack init`. Every command below only reads, and each one is followed by
# an explicit echo so the log shows where the first failure lands.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT: ostara-labs-infra
  GCP_REGION: europe-west1
  PULUMI_BACKEND: gs://ostara-labs-rulesets-state
  PULUMI_KMS_KEY: gcpkms://projects/ostara-labs-infra/locations/europe-west1/keyRings/pulumi/cryptoKeys/pulumi-stack-encryption
  STACK: devtools-rulesets

jobs:
  diagnose:
    name: Read-only stack diagnosis
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to GCP
        uses: google-github-actions/auth@90e6200b1b17a34b1473b3f1e40c0a63d0b2b1c5 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Install Pulumi
        uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: latest

      - name: Environment as the runner sees it
        run: |
          echo "=== versions ==="
          pulumi version
          gcloud --version | head -3
          echo
          echo "=== pulumi env (non-secret values only) ==="
          # Printed by echo, not by `env`: a diagnostic must not dump secrets,
          # and a PEM in the log would be worse than the bug it diagnoses.
          echo "PULUMI_BACKEND=$PULUMI_BACKEND"
          echo "PULUMI_KMS_KEY=$PULUMI_KMS_KEY"
          echo "PULUMI_CONFIG_PASSPHRASE set: ${PULUMI_CONFIG_PASSPHRASE:+yes}"
          echo "PULUMI_CONFIG_PASSPHRASE_FILE set: ${PULUMI_CONFIG_PASSPHRASE_FILE:+yes}"
          echo "GOOGLE_APPLICATION_CREDENTIALS set: ${GOOGLE_APPLICATION_CREDENTIALS:+yes}"
          echo "CLOUDSDK_CORE_PROJECT=$CLOUDSDK_CORE_PROJECT"
          echo
          echo "=== can this SA read the KMS key? (the actual crypto question) ==="
          gcloud kms keys describe pulumi-stack-encryption \
            --keyring=pulumi --location="$GCP_REGION" --project="$GCP_PROJECT" \
            --format='value(name,primary.state)' || echo "KMS DESCRIBE FAILED"

      - name: Log in to the backend
        run: |
          echo "=== pulumi login ==="
          pulumi login "$PULUMI_BACKEND" && echo "LOGIN OK" || echo "LOGIN FAILED"

      - name: What the backend contains
        working-directory: infra/rulesets
        run: |
          echo "=== stack ls ==="
          pulumi stack ls --all || echo "STACK LS FAILED"

      - name: What the stack file declares
        run: |
          echo "=== raw checkpoint: secrets_providers block ==="
          # pipefail: a failed `gcloud storage cat` would otherwise be masked by
          # python succeeding on empty stdin, printing a traceback as if the
          # read had worked.
          set -o pipefail
          gcloud storage cat "${PULUMI_BACKEND#gs://}/.pulumi/stacks/${STACK}/${STACK}.json" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps(d["checkpoint"]["latest"].get("secrets_providers"), indent=2))' \
            || echo "RAW READ FAILED"

      - name: Every read-only Pulumi command, one per line
        working-directory: infra/rulesets
        run: |
          # pipefail: without it every `cmd | head` below reports head's exit
          # code, so a FAILED command would print its echo as if it had worked.
          # A diagnostic that cannot tell success from failure is useless.
          set -o pipefail

          # Each command is isolated: the first failure says which operation
          # needs the passphrase, which is the whole question.
          echo "--- 1. stack select ---"
          pulumi stack select "$STACK" && echo "   SELECT OK" || echo "   SELECT FAILED"

          echo "--- 2. stack ls (post-select) ---"
          pulumi stack ls || echo "   LS FAILED"

          echo "--- 3. choose a stack, no decryption expected ---"
          pulumi stack --show-name 2>&1 | head -3 || echo "   SHOW-NAME FAILED"

          echo "--- 4. config: reads config, may decrypt ---"
          # No --show-secrets: Pulumi's own --help says it displays secret
          # VALUES "instead of displaying blinded values". This workflow's
          # subject includes an App private key, and a diagnostic that leaks it
          # into a CI log is worse than the failure it is investigating.
          pulumi config 2>&1 | head -10 || echo "   CONFIG FAILED"

          echo "--- 5. whoami (no stack state at all) ---"
          pulumi whoami 2>&1 | head -3 || echo "   WHOAMI FAILED"

          echo "--- 6. stack export: reads the checkpoint ---"
          pulumi stack export 2>&1 | head -5 || echo "   EXPORT FAILED"

          echo "--- 7. preview ---"
          pulumi preview --stack "$STACK" --non-interactive 2>&1 | tail -20 || echo "   PREVIEW FAILED"

      - name: Verdict
        if: always()
        run: |
          echo ""
          echo "=== READ THE LOG ABOVE, NOT THIS LINE ==="
          echo "The first command that reports passphrase is the operation that"
          echo "cannot resolve the gcpkms provider, even though the state declares"
          echo "it. That command, not the whole workflow, is what the fix must"
          echo "address."
