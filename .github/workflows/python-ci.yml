name: Python CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Detect Python stack
        id: detect
        shell: bash
        run: |
          if [ -f python/pyproject.toml ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Setup uv
        if: steps.detect.outputs.present == 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: false # uv manages its own environment; keep it simple

      - name: Sync dependencies
        if: steps.detect.outputs.present == 'true'
        run: uv sync --directory python

      - name: Lint
        if: steps.detect.outputs.present == 'true'
        run: uv run --directory python ruff check src tests

      - name: Format check
        if: steps.detect.outputs.present == 'true'
        run: uv run --directory python ruff format --check src tests

      - name: Test
        if: steps.detect.outputs.present == 'true'
        run: uv run --directory python pytest
