name: CI Gate

# Single universal status context required by the org ruleset ("gate").
# The logic is centralized and SHA-pinned in devtools — it cannot be
# weakened from this repository: ostara-labs/devtools/.github/actions/org-gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: ostara-labs/devtools/.github/actions/org-gate@v1